<svg viewBox="0 0 440 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HOTWHEELS CAR RENTAL LLC">
  <defs>
    <linearGradient id="hwFlameGrad" x1="60" y1="50" x2="220" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="35%" stop-color="#FF7A00" />
      <stop offset="70%" stop-color="#FF2A00" />
      <stop offset="100%" stop-color="#B30000" />
    </linearGradient>
    <radialGradient id="hwWheelHub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="45%" stop-color="#94A3B8" />
      <stop offset="70%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>
  </defs>

  <!-- Top Sports Car Silhouette -->
  <path d="M 65 52 C 120 48, 140 28, 200 18 C 270 18, 330 38, 420 70 C 380 62, 330 50, 270 42 C 220 34, 180 34, 120 48 C 90 54, 75 58, 65 52 Z" fill="#0F172A" />
  <!-- Flame Accent -->
  <path d="M 60 52 Q 90 62 130 63 Q 180 64 220 63 Q 150 68 110 66 Q 75 62 60 52 Z" fill="url(#hwFlameGrad)" />

  <!-- HOT WHEELS TEXT -->
  <text x="62" y="122" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="56" font-weight="900" fill="#0F172A">H</text>

  <!-- Wheel Assembly -->
  <path d="M 95 105 Q 85 92 105 84 Q 92 100 102 110 Q 88 108 95 105 Z" fill="url(#hwFlameGrad)" />
  <g transform="translate(130, 96)">
    <circle cx="0" cy="0" r="23" fill="#1E293B" stroke="#0F172A" stroke-width="2" />
    <circle cx="0" cy="0" r="20.5" fill="none" stroke="#E11D48" stroke-width="1" />
    <circle cx="0" cy="0" r="19" fill="#475569" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="0" cy="0" r="16" fill="url(#hwWheelHub)" />
    <!-- 8 Spokes -->
    <line x1="0" y1="0" x2="14" y2="0" stroke="#F8FAFC" stroke-width="2.2" stroke-linecap="round" />
    <line x1="0" y1="0" x2="9.9" y2="9.9" stroke="#F8FAFC" stroke-width="2.2" stroke-linecap="round" />
    <line x1="0" y1="0" x2="0" y2="14" stroke="#F8FAFC" stroke-width="2.2" stroke-linecap="round" />
    <line x1="0" y1="0" x2="-9.9" y2="9.9" stroke="#F8FAFC" stroke-width="2.2" stroke-linecap="round" />
    <line x1="0" y1="0" x2="-14" y2="0" stroke="#F8FAFC" stroke-width="2.2" stroke-linecap="round" />
    <line x1="0" y1="0" x2="-9.9" y2="-9.9" stroke="#F8FAFC" stroke-width="2.2" stroke-linecap="round" />
    <line x1="0" y1="0" x2="0" y2="-14" stroke="#F8FAFC" stroke-width="2.2" stroke-linecap="round" />
    <line x1="0" y1="0" x2="9.9" y2="-9.9" stroke="#F8FAFC" stroke-width="2.2" stroke-linecap="round" />
    <circle cx="0" cy="0" r="5" fill="#0F172A" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="0" cy="0" r="2" fill="#E11D48" />
