  <text x="162" y="122" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="56" font-weight="900" fill="#0F172A">T</text>
  <text x="215" y="122" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="56" font-weight="900" letter-spacing="1" fill="#0F172A">WHEELS</text>
  <text x="62" y="152" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4" fill="#0F172A">CAR RENTAL</text>
  <rect x="290" y="136" width="46" height="18" rx="4" fill="#0F172A" />
  <text x="313" y="149" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#FFE600" text-anchor="middle">LLC</text>
